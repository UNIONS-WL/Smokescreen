name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  # Required gate: clean pip install, import discipline, and an end-to-end
  # blind through a synthetic (non-CCL) theory callable. No conda anywhere;
  # numpy is unconstrained above the declared >=2.2 floor.
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install smokescreen (fresh pip install from pyproject)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Assert import succeeds
        run: python -c "import smokescreen"

      - name: Synthetic-callable blind smoke test
        run: python .github/scripts/backend_smoke.py

  # Full unit-test suite, pip-only (installs the [test] extra).
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install smokescreen with test extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'

      - name: Test with pytest
        run: pytest --cov=smokescreen --cov-report=xml ./tests

  # Lint runs independently of the test suite so a red pytest never hides
  # a lint failure (and vice versa).
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: flake8
        uses: py-actions/flake8@v2
        with:
          max-line-length: "120"
