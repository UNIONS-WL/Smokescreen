name: Documentation
on:
  push:
    branches:
      - main
      - docs
  pull_request:
jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install package with docs extra
      run: |
        python -m pip install --upgrade pip
        python -m pip install '.[docs]'
      # -n flags unresolvable cross-references, -W makes every warning fatal:
      # the docs are the fork's API contract, so a broken reference is a
      # build failure, not a line of log nobody reads.
    - name: Build Sphinx documentation
      run: |
        cd docs
        python -m sphinx -n -W -b html source build
